name: minecraft

services:
    postgres:
        image: postgres:17
        restart: unless-stopped
        env_file: .env
        volumes:
            - postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            retries: 10

    api:
        build: ./server
        restart: unless-stopped
        env_file: .env
        environment:
            MC_HOST: minecraft
            PUBLIC_URL: ${API_URL}
            RCON_HOST: minecraft
        volumes:
            - ./data:/data
        healthcheck:
            test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/yggdrasil/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
            interval: 5s
            retries: 20
        depends_on:
            postgres:
                condition: service_healthy

    caddy:
        image: caddy:2
        restart: unless-stopped
        environment:
            API_URL: ${API_URL}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - ./data/files:/data/files:ro
            - ./data/textures:/data/textures:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - api

    authlib:
        image: curlimages/curl
        user: root
        restart: "no"
        entrypoint: ["sh", "-c"]
        command:
            - >
                test -f /data/authlib-injector.jar ||
                curl -fsSL -o /data/authlib-injector.jar
                https://github.com/yushijinhun/authlib-injector/releases/download/v1.2.5/authlib-injector-1.2.5.jar
        volumes:
            - ./data/mc:/data

    minecraft:
        image: itzg/minecraft-server:java21
        restart: unless-stopped
        environment:
            EULA: "TRUE"
            TYPE: ${MC_LOADER}
            VERSION: ${MC_VERSION}
            FABRIC_LOADER_VERSION: ${MC_LOADER_VERSION:-}
            FORGE_VERSION: ${MC_LOADER_VERSION:-}
            NEOFORGE_VERSION: ${MC_LOADER_VERSION:-}
            ONLINE_MODE: "TRUE"
            ENFORCE_SECURE_PROFILE: "FALSE"
            ENABLE_WHITELIST: "TRUE"
            ENFORCE_WHITELIST: "TRUE"
            ENABLE_RCON: "TRUE"
            RCON_PASSWORD: ${RCON_PASSWORD}
            MEMORY: ${MC_MEMORY:-4G}
            JVM_OPTS: -javaagent:/data/authlib-injector.jar=http://api:3000/api/yggdrasil/ -Dsun.net.client.defaultConnectTimeout=10000 -Dsun.net.client.defaultReadTimeout=10000
        volumes:
            - ./data/mc:/data
        depends_on:
            authlib:
                condition: service_completed_successfully
            api:
                condition: service_healthy

    frpc:
        image: fatedier/frpc:v0.61.1
        restart: unless-stopped
        command: ["-c", "/etc/frp/frpc.toml"]
        environment:
            FRP_TOKEN: ${FRP_TOKEN}
            FRP_SERVER_ADDR: ${FRP_SERVER_ADDR}
        volumes:
            - ./frpc.toml:/etc/frp/frpc.toml:ro
        depends_on:
            - caddy
            - minecraft

volumes:
    postgres:
    caddy_data:
    caddy_config:
