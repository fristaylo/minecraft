[package]
name = "launcher"
version = "0.1.0"
edition = "2021"

[lib]
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio = { version = "1", features = ["rt", "fs", "io-util", "process", "time", "macros", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.33"
base64 = "0.22"
notify = "7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

[profile.release]
lto = true
codegen-units = 1
strip = true
