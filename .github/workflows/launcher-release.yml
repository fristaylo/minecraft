name: Launcher release

on:
    push:
        branches: [master]
        paths: ['launcher/**']
    workflow_dispatch:

concurrency:
    group: launcher-release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    version:
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '--fix')
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            release_id: ${{ steps.release.outputs.release_id }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Compute version
              id: version
              run: |
                  LATEST=$(git tag --list 'launcher-v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
                  if [ -z "$LATEST" ]; then
                      BASE=$(jq -r .version launcher/src-tauri/tauri.conf.json)
                  else
                      BASE=${LATEST#launcher-v}
                  fi
                  echo "version=${BASE%.*}.$((${BASE##*.} + 1))" >> "$GITHUB_OUTPUT"

            - name: Create release
              id: release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  ID=$(gh api "repos/${{ github.repository }}/releases" \
                      -f tag_name="launcher-v${{ steps.version.outputs.version }}" \
                      -f name="Launcher v${{ steps.version.outputs.version }}" \
                      -f target_commitish="${{ github.sha }}" \
                      -F draft=true \
                      --jq .id)
                  echo "release_id=$ID" >> "$GITHUB_OUTPUT"

    build:
        needs: version
        strategy:
            max-parallel: 1
            matrix:
                include:
                    - platform: windows-latest
                      args: ''
                      targets: ''
                    - platform: macos-latest
                      args: --target universal-apple-darwin
                      targets: aarch64-apple-darwin,x86_64-apple-darwin
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: launcher/package-lock.json

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.targets }}

            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: launcher/src-tauri

            - run: npm ci
              working-directory: launcher

            - name: Set version
              shell: bash
              run: |
                  jq --arg v "${{ needs.version.outputs.version }}" '.version = $v' launcher/src-tauri/tauri.conf.json > tauri.conf.tmp
                  mv tauri.conf.tmp launcher/src-tauri/tauri.conf.json

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  API_URL: ${{ vars.API_URL }}
                  MODS_REPO: ${{ github.repository }}
              with:
                  projectPath: launcher
                  releaseId: ${{ needs.version.outputs.release_id }}
                  tagName: launcher-v${{ needs.version.outputs.version }}
                  releaseName: Launcher v${{ needs.version.outputs.version }}
                  releaseDraft: true
                  includeUpdaterJson: true
                  args: ${{ matrix.args }}

    publish:
        needs: [version, build]
        runs-on: ubuntu-latest
        steps:
            - name: Publish release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.version.outputs.release_id }}" -F draft=false
