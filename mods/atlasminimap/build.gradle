plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version

repositories {
	maven {
		url 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven { url 'https://maven.shedaniel.me/' }
	maven { url 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modCompileOnly "maven.modrinth:antique-atlas-4:3.1.2+1.21"
	modCompileOnly "maven.modrinth:surveyor:1.2.4+1.21"
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:15.0.140") {
		exclude(group: 'net.fabricmc.fabric-api')
	}
	modCompileOnly "com.terraformersmc:modmenu:11.0.5"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
